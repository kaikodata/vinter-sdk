name: Running Pytest

on:
  push:
    branches:
      - main
    # - stage
  pull_request:
    branches:
      - main
      - stage

jobs:
  tests:
    runs-on: ubuntu-latest
    # defaults:
    #   run:
    #     working-directory: ./app

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          make install
      - name: Running Tests
        run: |
          make test
